# Image-only override used by CI after the three production Dockerfiles have
# already been built and loaded into the runner's local engine.
services:
  postgres:
    image: worship-sync-postgres:ci
    pull_policy: never
    entrypoint: !reset null
    volumes: !override
      - postgres-data:/var/lib/postgresql
  migrate:
    image: worship-sync-backend:ci
  api:
    image: worship-sync-backend:ci
  scheduler:
    image: worship-sync-backend:ci
  worker:
    image: worship-sync-backend:ci
  notification-worker:
    image: worship-sync-backend:ci
  bootstrap-admin:
    image: worship-sync-backend:ci
  gateway:
    image: worship-sync-frontend:ci
