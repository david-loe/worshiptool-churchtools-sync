name: Platform CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install backend
        run: python -m pip install --require-hashes --no-deps -r backend/requirements-test.lock
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Test backend
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests --cov=app --cov-report=term-missing
      - name: Check migration drift
        env:
          PYTHONPATH: backend
          WT_SYNC_DATABASE_URL: sqlite:////tmp/worship-sync-ci.db
          WT_SYNC_DATABASE_OWNER_URL: sqlite:////tmp/worship-sync-ci.db
        run: alembic -c backend/alembic.ini upgrade head && alembic -c backend/alembic.ini check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: pnpm build
      - name: Unit tests
        run: pnpm test
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser smoke tests
        run: pnpm test:e2e

  postgres-role-boundary:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: worshipsync
          POSTGRES_USER: worshipsync_owner
          POSTGRES_PASSWORD: owner-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worshipsync_owner -d worshipsync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install backend
        run: python -m pip install --require-hashes --no-deps -r backend/requirements-test.lock
      - name: Provision least-privilege roles from files
        env:
          PGPASSWORD: owner-ci-password
        run: |
          mkdir -p "$RUNNER_TEMP/pg-role-secrets"
          printf '%s\n' owner-ci-password >"$RUNNER_TEMP/pg-role-secrets/owner"
          printf '%s\n' api-ci-password >"$RUNNER_TEMP/pg-role-secrets/api"
          printf '%s\n' worker-ci-password >"$RUNNER_TEMP/pg-role-secrets/worker"
          printf '%s\n' admin-ci-password >"$RUNNER_TEMP/pg-role-secrets/admin"
          chmod 600 "$RUNNER_TEMP/pg-role-secrets/"*
          docker run --rm --network host \
            --env PGHOST=127.0.0.1 \
            --env PGPASSWORD \
            --env POSTGRES_DB=worshipsync \
            --env POSTGRES_USER=worshipsync_owner \
            --env POSTGRES_PASSWORD_FILE=/run/secrets/owner \
            --env POSTGRES_API_PASSWORD_FILE=/run/secrets/api \
            --env POSTGRES_WORKER_PASSWORD_FILE=/run/secrets/worker \
            --env POSTGRES_ADMIN_PASSWORD_FILE=/run/secrets/admin \
            --volume "$RUNNER_TEMP/pg-role-secrets/owner:/run/secrets/owner:ro" \
            --volume "$RUNNER_TEMP/pg-role-secrets/api:/run/secrets/api:ro" \
            --volume "$RUNNER_TEMP/pg-role-secrets/worker:/run/secrets/worker:ro" \
            --volume "$RUNNER_TEMP/pg-role-secrets/admin:/run/secrets/admin:ro" \
            --volume "$GITHUB_WORKSPACE/deploy/postgres/001-create-app-role.sh:/init.sh:ro" \
            postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2 \
            sh /init.sh
      - name: Migrate fresh PostgreSQL 18 database
        env:
          PYTHONPATH: backend
          WT_SYNC_DATABASE_URL: postgresql+psycopg://worshipsync_api:api-ci-password@127.0.0.1:5432/worshipsync
          WT_SYNC_DATABASE_OWNER_URL: postgresql+psycopg://worshipsync_owner:owner-ci-password@127.0.0.1:5432/worshipsync
        run: alembic -c backend/alembic.ini upgrade head
      - name: Rotate all role passwords through secret files
        env:
          PGPASSWORD: owner-ci-password
        run: |
          printf '%s\n' owner-rotated-ci-password >"$RUNNER_TEMP/pg-role-secrets/owner"
          printf '%s\n' api-rotated-ci-password >"$RUNNER_TEMP/pg-role-secrets/api"
          printf '%s\n' worker-rotated-ci-password >"$RUNNER_TEMP/pg-role-secrets/worker"
          printf '%s\n' admin-rotated-ci-password >"$RUNNER_TEMP/pg-role-secrets/admin"
          docker run --rm --network host \
            --env PGHOST=127.0.0.1 \
            --env PGPASSWORD \
            --env POSTGRES_DB=worshipsync \
            --env POSTGRES_USER=worshipsync_owner \
            --env POSTGRES_PASSWORD_FILE=/run/secrets/owner \
            --env POSTGRES_API_PASSWORD_FILE=/run/secrets/api \
            --env POSTGRES_WORKER_PASSWORD_FILE=/run/secrets/worker \
            --env POSTGRES_ADMIN_PASSWORD_FILE=/run/secrets/admin \
            --volume "$RUNNER_TEMP/pg-role-secrets/owner:/run/secrets/owner:ro" \
            --volume "$RUNNER_TEMP/pg-role-secrets/api:/run/secrets/api:ro" \
            --volume "$RUNNER_TEMP/pg-role-secrets/worker:/run/secrets/worker:ro" \
            --volume "$RUNNER_TEMP/pg-role-secrets/admin:/run/secrets/admin:ro" \
            --volume "$GITHUB_WORKSPACE/deploy/postgres/001-create-app-role.sh:/init.sh:ro" \
            postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2 \
            sh /init.sh
      - name: Verify role boundary and migration drift
        env:
          PYTHONPATH: backend
          PGTEST_OWNER_URL: postgresql://worshipsync_owner:owner-rotated-ci-password@127.0.0.1:5432/worshipsync
          PGTEST_API_URL: postgresql://worshipsync_api:api-rotated-ci-password@127.0.0.1:5432/worshipsync
          PGTEST_WORKER_URL: postgresql://worshipsync_worker:worker-rotated-ci-password@127.0.0.1:5432/worshipsync
          PGTEST_ADMIN_URL: postgresql://worshipsync_admin:admin-rotated-ci-password@127.0.0.1:5432/worshipsync
          PGTEST_REJECTED_URLS: >-
            postgresql://worshipsync_owner:owner-ci-password@127.0.0.1:5432/worshipsync,
            postgresql://worshipsync_api:api-ci-password@127.0.0.1:5432/worshipsync,
            postgresql://worshipsync_worker:worker-ci-password@127.0.0.1:5432/worshipsync,
            postgresql://worshipsync_admin:admin-ci-password@127.0.0.1:5432/worshipsync
          WT_SYNC_DATABASE_URL: postgresql+psycopg://worshipsync_api:api-rotated-ci-password@127.0.0.1:5432/worshipsync
          WT_SYNC_DATABASE_OWNER_URL: postgresql+psycopg://worshipsync_owner:owner-rotated-ci-password@127.0.0.1:5432/worshipsync
        run: |
          python backend/tests/postgres_role_integration.py
          alembic -c backend/alembic.ini check
      - name: Smoke-test owner-only bootstrap
        env:
          PYTHONPATH: backend
          WT_SYNC_ENVIRONMENT: production
          WT_SYNC_DATABASE_URL: postgresql+psycopg://worshipsync_owner:owner-rotated-ci-password@127.0.0.1:5432/worshipsync
          WT_SYNC_PUBLIC_BASE_URL: https://sync.example.org
          WT_SYNC_APPLICATION_SECRET: ci-application-secret-value-1234567890
          WT_SYNC_ENCRYPTION_SECRET: ci-encryption-secret-value-09876543210
          WT_SYNC_SMTP_HOST: smtp.example.org
          WT_SYNC_BOOTSTRAP_ADMIN_EMAIL: bootstrap-ci@example.invalid
          WT_SYNC_BOOTSTRAP_ADMIN_PASSWORD: bootstrap-test-password-value-123456
        run: python -m app.bootstrap_admin

  compose-and-images:
    runs-on: ubuntu-latest
    needs: [backend, frontend, postgres-role-boundary]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create CI-only Compose secret files
        run: |
          mkdir -p secrets
          printf '%s\n' owner-ci-password >secrets/postgres-owner-password
          printf '%s\n' api-ci-password >secrets/postgres-api-password
          printf '%s\n' worker-ci-password >secrets/postgres-worker-password
          printf '%s\n' admin-ci-password >secrets/postgres-admin-password
          printf '%s\n' 'postgresql+psycopg://worshipsync_owner:owner-ci-password@postgres:5432/worshipsync' >secrets/database-owner-url
          printf '%s\n' 'postgresql+psycopg://worshipsync_api:api-ci-password@postgres:5432/worshipsync' >secrets/database-api-url
          printf '%s\n' 'postgresql+psycopg://worshipsync_worker:worker-ci-password@postgres:5432/worshipsync' >secrets/database-worker-url
          printf '%s\n' 'postgresql+psycopg://worshipsync_admin:admin-ci-password@postgres:5432/worshipsync' >secrets/database-admin-url
          printf '%s\n' 'redis://redis:6379/0' >secrets/redis-url
          printf '%s\n' ci-application-secret-value-1234567890 >secrets/application-secret
          printf '%s\n' ci-encryption-secret-value-09876543210 >secrets/encryption-secret
          printf '%s\n' '{}' >secrets/encryption-previous-secrets.json
          printf '%s\n' smtp-ci-password >secrets/smtp-password
          printf '\n' >secrets/vapid-private-key
          printf '\n' >secrets/telegram-bot-token
          printf '%s\n' bootstrap-test-password-value-123456 >secrets/bootstrap-admin-password
          chmod 640 secrets/*
      - name: Validate Compose
        run: docker compose --env-file .env.example config --quiet
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: backend
          push: false
          load: true
          tags: worship-sync-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: frontend
          push: false
          load: true
          tags: worship-sync-frontend:ci
      - name: Hardened gateway smoke test
        run: sh frontend/scripts/gateway-smoke.sh worship-sync-frontend:ci
      - name: Boot and probe the complete production stack
        run: |
          export SECRETS_GID="$(id -g)"
          project=worship-sync-platform-ci
          compose="docker compose -p $project --env-file .env.example -f compose.yaml -f deploy/compose.ci.yaml"
          cleanup() {
            $compose down --volumes --remove-orphans
          }
          trap cleanup EXIT INT TERM
          $compose up --detach --no-build --wait --wait-timeout 180
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          api_container="$($compose ps -q api)"
          attached_networks="$(docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}}' "$api_container")"
          [ -n "$attached_networks" ]
          for attached_network in $attached_networks; do
            if [ "$(docker network inspect --format '{{.Internal}}' "$attached_network")" != true ]; then
              echo "API is attached to non-internal network: $attached_network" >&2
              exit 1
            fi
          done
          edge_network="${project}_edge"
          [ "$(docker network inspect --format '{{.Internal}}' "$edge_network")" = false ]
          edge_members="$(docker network inspect --format '{{range .Containers}}{{.Name}} {{end}}' "$edge_network")"
          if [ "$edge_members" != "${project}-gateway-1 " ]; then
            echo "Edge network must contain only the gateway; got: $edge_members" >&2
            exit 1
          fi
          docker exec "$api_container" python -c \
            "import urllib.request; response = urllib.request.urlopen('http://gateway:8080/healthz', timeout=3); assert response.status == 200"
          if docker exec "$api_container" python -c \
            "import socket; connection = socket.socket(); connection.settimeout(2); raise SystemExit(connection.connect_ex(('1.1.1.1', 443)))"; then
            echo "API unexpectedly has external network egress" >&2
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:8080/health/ready \
            | grep -q '"status":"ok"'
          curl --fail --silent --show-error http://127.0.0.1:8080/ \
            | grep -q '<div id="app"'
          api_status="$(curl --silent --show-error --output /tmp/api-response \
            --write-out '%{http_code}' http://127.0.0.1:8080/api/v1/auth/me)"
          [ "$api_status" = 401 ]
          grep -q '"code":"authentication_required"' /tmp/api-response
          if grep -q '<div id="app"' /tmp/api-response; then
            echo "API request was incorrectly rewritten to the SPA" >&2
            exit 1
          fi
          $compose --profile tools run --rm bootstrap-admin
          login_status="$(curl --silent --show-error \
            --dump-header /tmp/login-headers \
            --output /tmp/login-response \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"email":"admin@example.org","password":"bootstrap-test-password-value-123456"}' \
            http://127.0.0.1:8080/api/v1/auth/login)"
          [ "$login_status" = 200 ]
          csrf_token="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["csrf_token"])' \
            /tmp/login-response)"
          session_cookie="$(python3 -c \
            'import re,sys; match=re.search(r"(?im)^set-cookie:\s*wt_session=([^;]+)", open(sys.argv[1], encoding="utf-8").read()); assert match; print(match.group(1))' \
            /tmp/login-headers)"
          cookie_header="wt_session=$session_cookie; wt_csrf=$csrf_token"

          workspace_status="$(curl --silent --show-error \
            --output /tmp/workspace-response \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "Cookie: $cookie_header" \
            --header "X-CSRF-Token: $csrf_token" \
            --data '{"name":"Probe queue smoke"}' \
            http://127.0.0.1:8080/api/v1/workspaces)"
          [ "$workspace_status" = 201 ]
          workspace_id="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["id"])' \
            /tmp/workspace-response)"

          connection_status="$(curl --silent --show-error \
            --output /tmp/connection-response \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "Cookie: $cookie_header" \
            --header "X-CSRF-Token: $csrf_token" \
            --data '{"provider":"worshiptools","name":"Queue smoke","settings":{},"credentials":{}}' \
            "http://127.0.0.1:8080/api/v1/workspaces/$workspace_id/connections")"
          [ "$connection_status" = 201 ]
          connection_id="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["id"])' \
            /tmp/connection-response)"

          probe_status="$(curl --silent --show-error \
            --output /tmp/probe-response \
            --write-out '%{http_code}' \
            --request POST \
            --header "Cookie: $cookie_header" \
            --header "X-CSRF-Token: $csrf_token" \
            "http://127.0.0.1:8080/api/v1/workspaces/$workspace_id/connections/$connection_id/test")"
          [ "$probe_status" = 200 ]
          python3 -c \
            'import json,sys; result=json.load(open(sys.argv[1], encoding="utf-8")); assert result["succeeded"] is False; assert result["tested_at"]' \
            /tmp/probe-response
          curl --fail --silent --show-error \
            --header "Cookie: $cookie_header" \
            "http://127.0.0.1:8080/api/v1/workspaces/$workspace_id/connections/$connection_id" \
            > /tmp/connection-after-probe
          python3 -c \
            'import json,sys; connection=json.load(open(sys.argv[1], encoding="utf-8")); assert connection["last_tested_at"]; assert connection["last_test_succeeded"] is False' \
            /tmp/connection-after-probe
