name: Tests

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements-legacy.lock

      - name: Compile Python files
        run: python -m py_compile cache.py churchtools_api.py custom_types.py manager.py matcher.py sync.py telegram.py utils.py worshiptools_api.py

      - name: Run tests
        run: python -m pytest
