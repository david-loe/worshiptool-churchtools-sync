name: worship-sync

x-runtime-environment: &runtime-environment
  WT_SYNC_ENVIRONMENT: ${WT_SYNC_ENVIRONMENT:-production}
  WT_SYNC_REDIS_URL_FILE: /run/secrets/redis_url
  WT_SYNC_APPLICATION_SECRET_FILE: /run/secrets/application_secret
  WT_SYNC_ENCRYPTION_SECRET_FILE: /run/secrets/encryption_secret
  WT_SYNC_ENCRYPTION_KEY_VERSION: ${WT_SYNC_ENCRYPTION_KEY_VERSION:-1}
  WT_SYNC_ENCRYPTION_PREVIOUS_SECRETS_FILE: /run/secrets/encryption_previous_secrets
  WT_SYNC_API_PREFIX: ${WT_SYNC_API_PREFIX:-/api/v1}
  WT_SYNC_PUBLIC_BASE_URL: ${WT_SYNC_PUBLIC_BASE_URL}
  WT_SYNC_CORS_ORIGINS: ${WT_SYNC_CORS_ORIGINS:-[]}
  WT_SYNC_COOKIE_SECURE: ${WT_SYNC_COOKIE_SECURE:-true}
  WT_SYNC_REGISTRATION_ENABLED: ${WT_SYNC_REGISTRATION_ENABLED:-true}
  WT_SYNC_REQUIRE_EMAIL_VERIFICATION: ${WT_SYNC_REQUIRE_EMAIL_VERIFICATION:-true}
  WT_SYNC_ADMIN_MFA_MAX_AGE_SECONDS: ${WT_SYNC_ADMIN_MFA_MAX_AGE_SECONDS:-43200}
  WT_SYNC_VERIFICATION_RESEND_COOLDOWN_SECONDS: ${WT_SYNC_VERIFICATION_RESEND_COOLDOWN_SECONDS:-300}
  WT_SYNC_INVITE_RESEND_COOLDOWN_SECONDS: ${WT_SYNC_INVITE_RESEND_COOLDOWN_SECONDS:-300}
  WT_SYNC_MAX_CONNECTIONS_PER_WORKSPACE: ${WT_SYNC_MAX_CONNECTIONS_PER_WORKSPACE:-20}
  WT_SYNC_MAX_PUSH_SUBSCRIPTIONS_PER_USER_WORKSPACE: ${WT_SYNC_MAX_PUSH_SUBSCRIPTIONS_PER_USER_WORKSPACE:-10}
  WT_SYNC_PASSWORD_HASH_MAX_CONCURRENCY: ${WT_SYNC_PASSWORD_HASH_MAX_CONCURRENCY:-2}
  WT_SYNC_PASSWORD_HASH_ACQUIRE_TIMEOUT_SECONDS: ${WT_SYNC_PASSWORD_HASH_ACQUIRE_TIMEOUT_SECONDS:-0.25}
  WT_SYNC_EXPOSE_DEVELOPMENT_TOKENS: "false"
  WT_SYNC_VAPID_PUBLIC_KEY: ${WT_SYNC_VAPID_PUBLIC_KEY:-}
  # Production settings validate this non-secret for every backend process;
  # SMTP credentials remain isolated to the notification worker.
  WT_SYNC_SMTP_HOST: ${WT_SYNC_SMTP_HOST:-}

x-backend: &backend
  build:
    context: ./backend
  environment: *runtime-environment
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # Compose file-backed secrets retain host ownership. Add only the dedicated
  # host secret-reader group; the process still runs as the image's uid 10001.
  group_add:
    - ${SECRETS_GID:-1000}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - internal

services:
  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    entrypoint: ["/bin/sh", "/opt/worshipsync/postgres-entrypoint.sh"]
    command: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
      POSTGRES_API_PASSWORD_FILE: /run/secrets/postgres_api_password
      POSTGRES_WORKER_PASSWORD_FILE: /run/secrets/postgres_worker_password
      POSTGRES_ADMIN_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_owner_password
      - postgres_api_password
      - postgres_worker_password
      - postgres_admin_password
    volumes:
      # PostgreSQL 18 moved PGDATA below this version-neutral mount point.
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/001-create-app-role.sh:/docker-entrypoint-initdb.d/001-create-app-role.sh:ro
      - ./deploy/postgres/entrypoint.sh:/opt/worshipsync/postgres-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    group_add:
      - ${SECRETS_GID:-1000}
    networks:
      - internal

  redis:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  migrate:
    <<: *backend
    restart: "no"
    environment:
      <<: *runtime-environment
      WT_SYNC_DATABASE_URL_FILE: /run/secrets/database_api_url
      WT_SYNC_DATABASE_OWNER_URL_FILE: /run/secrets/database_owner_url
    secrets:
      - database_api_url
      - database_owner_url
      - redis_url
      - application_secret
      - encryption_secret
      - encryption_previous_secrets
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *backend
    environment:
      <<: *runtime-environment
      WT_SYNC_DATABASE_URL_FILE: /run/secrets/database_api_url
      WT_SYNC_DATABASE_ADMIN_URL_FILE: /run/secrets/database_admin_url
    secrets:
      - database_api_url
      - database_admin_url
      - redis_url
      - application_secret
      - encryption_secret
      - encryption_previous_secrets
    # Only the non-public Caddy service can reach this port from the web
    # network, so forwarded headers may be trusted from the direct peer.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*", "--no-access-log"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal
      - web

  scheduler:
    <<: *backend
    environment:
      <<: *runtime-environment
      WT_SYNC_DATABASE_URL_FILE: /run/secrets/database_worker_url
    secrets:
      - database_worker_url
      - redis_url
      - application_secret
      - encryption_secret
      - encryption_previous_secrets
    command: ["python", "-m", "app.scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *backend
    environment:
      <<: *runtime-environment
      WT_SYNC_DATABASE_URL_FILE: /run/secrets/database_worker_url
    secrets:
      - database_worker_url
      - redis_url
      - application_secret
      - encryption_secret
      - encryption_previous_secrets
    command: ["dramatiq", "app.worker", "--processes", "1", "--threads", "2", "--queues", "sync", "probes"]
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal
      - egress

  notification-worker:
    <<: *backend
    environment:
      <<: *runtime-environment
      WT_SYNC_DATABASE_URL_FILE: /run/secrets/database_worker_url
      WT_SYNC_SMTP_PORT: ${WT_SYNC_SMTP_PORT:-587}
      WT_SYNC_SMTP_USERNAME: ${WT_SYNC_SMTP_USERNAME:-}
      WT_SYNC_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      WT_SYNC_SMTP_FROM: ${WT_SYNC_SMTP_FROM:-Worship Sync <noreply@localhost>}
      WT_SYNC_SMTP_STARTTLS: ${WT_SYNC_SMTP_STARTTLS:-true}
      WT_SYNC_SMTP_TIMEOUT_SECONDS: ${WT_SYNC_SMTP_TIMEOUT_SECONDS:-15}
      WT_SYNC_VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid_private_key
      WT_SYNC_VAPID_SUBJECT: ${WT_SYNC_VAPID_SUBJECT:-}
      WT_SYNC_TELEGRAM_ENABLED: ${WT_SYNC_TELEGRAM_ENABLED:-false}
      WT_SYNC_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      WT_SYNC_TELEGRAM_CHAT_ID: ${WT_SYNC_TELEGRAM_CHAT_ID:-}
      WT_SYNC_TELEGRAM_WORKSPACE_ID: ${WT_SYNC_TELEGRAM_WORKSPACE_ID:-}
      WT_SYNC_OUTBOX_BATCH_SIZE: ${WT_SYNC_OUTBOX_BATCH_SIZE:-10}
      WT_SYNC_OUTBOX_MAX_ATTEMPTS: ${WT_SYNC_OUTBOX_MAX_ATTEMPTS:-8}
      WT_SYNC_OUTBOX_LEASE_SECONDS: ${WT_SYNC_OUTBOX_LEASE_SECONDS:-300}
      WT_SYNC_RETENTION_DAYS: ${WT_SYNC_RETENTION_DAYS:-90}
    secrets:
      - database_worker_url
      - redis_url
      - application_secret
      - encryption_secret
      - encryption_previous_secrets
      - smtp_password
      - vapid_private_key
      - telegram_bot_token
    command: ["dramatiq", "app.worker", "--processes", "1", "--threads", "2", "--queues", "notifications"]
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal
      - egress

  bootstrap-admin:
    <<: *backend
    profiles: ["tools"]
    restart: "no"
    environment:
      <<: *runtime-environment
      WT_SYNC_DATABASE_URL_FILE: /run/secrets/database_owner_url
      WT_SYNC_BOOTSTRAP_ADMIN_EMAIL: ${WT_SYNC_BOOTSTRAP_ADMIN_EMAIL:-}
      WT_SYNC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
    secrets:
      - database_owner_url
      - redis_url
      - application_secret
      - encryption_secret
      - encryption_previous_secrets
      - bootstrap_admin_password
    command: ["python", "-m", "app.bootstrap_admin"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  gateway:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${WT_SYNC_API_PREFIX:-/api/v1}
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:8000
    ports:
      # Secure default for a host-local TLS reverse proxy. Set
      # GATEWAY_BIND_ADDRESS explicitly only when a remote load balancer must
      # reach this plain-HTTP hop.
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - web
      - edge

networks:
  internal:
    internal: true
  # Only sync and notification workers need provider/SMTP/Web-Push egress.
  # PostgreSQL, Redis and the scheduler remain on the isolated network.
  egress:
  # Gateway-to-API traffic is private. Publishing the gateway port still
  # exposes only Caddy on the configured host bind address.
  web:
    internal: true
  # Docker does not publish ports for a container attached only to internal
  # networks. This edge is deliberately attached to Caddy alone; the API has
  # no route or membership here.
  edge:

volumes:
  postgres-data:
  redis-data:

secrets:
  postgres_owner_password:
    file: ${POSTGRES_OWNER_PASSWORD_FILE}
  postgres_api_password:
    file: ${POSTGRES_API_PASSWORD_FILE}
  postgres_worker_password:
    file: ${POSTGRES_WORKER_PASSWORD_FILE}
  postgres_admin_password:
    file: ${POSTGRES_ADMIN_PASSWORD_FILE}
  database_owner_url:
    file: ${WT_SYNC_DATABASE_OWNER_URL_FILE}
  database_api_url:
    file: ${WT_SYNC_DATABASE_API_URL_FILE}
  database_worker_url:
    file: ${WT_SYNC_DATABASE_WORKER_URL_FILE}
  database_admin_url:
    file: ${WT_SYNC_DATABASE_ADMIN_URL_FILE}
  redis_url:
    file: ${WT_SYNC_REDIS_URL_FILE}
  application_secret:
    file: ${WT_SYNC_APPLICATION_SECRET_FILE}
  encryption_secret:
    file: ${WT_SYNC_ENCRYPTION_SECRET_FILE}
  encryption_previous_secrets:
    file: ${WT_SYNC_ENCRYPTION_PREVIOUS_SECRETS_FILE}
  smtp_password:
    file: ${WT_SYNC_SMTP_PASSWORD_FILE}
  vapid_private_key:
    file: ${WT_SYNC_VAPID_PRIVATE_KEY_FILE}
  telegram_bot_token:
    file: ${WT_SYNC_TELEGRAM_BOT_TOKEN_FILE}
  bootstrap_admin_password:
    file: ${WT_SYNC_BOOTSTRAP_ADMIN_PASSWORD_FILE}
