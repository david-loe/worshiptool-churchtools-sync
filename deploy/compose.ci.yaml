    image: worship-sync-backend:ci
  api:
    image: worship-sync-backend:ci
  scheduler:
    image: worship-sync-backend:ci
  worker:
    image: worship-sync-backend:ci
  notification-worker:
    image: worship-sync-backend:ci
  bootstrap-admin:
    image: worship-sync-backend:ci
  gateway:
    image: worship-sync-frontend:ci
